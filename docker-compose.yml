version: "3.8"

services:
  # ─── Reverse Proxy ───
  nginx:
    image: nginx:1.25-alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sms-network

  # ─── Frontend (React) ───
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: sms-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:4000/api/v1}
      - VITE_WS_URL=${WS_URL:-http://localhost:4000}
    expose:
      - "3000"
    networks:
      - sms-network

  # ─── Backend (Node.js API + WebSocket) ───
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sms-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - upload-data:/app/uploads
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sms-network

  # ─── PostgreSQL Datenbank ───
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sms-network

volumes:
  postgres-data:
    driver: local
  upload-data:
    driver: local

networks:
  sms-network:
    driver: bridge
