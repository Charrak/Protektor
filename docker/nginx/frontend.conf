server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Routing – alle Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching für statische Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
